
name: Build Joguinho APK

on:
  push:
    paths:
      - 'joguinho.zip'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compile Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check ZIP
        run: |
          if [ ! -f joguinho.zip ]; then
            echo "ERROR: joguinho.zip not found!"
            exit 1
          fi

      - name: Extract project
        run: |
          mkdir -p extracted
          unzip -q joguinho.zip -d extracted

          PROJECT_DIR=$(find extracted -type f -name settings.gradle -printf '%h\n' | head -n 1)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: settings.gradle not found!"
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/app/build.gradle" ]; then
            echo "ERROR: Android app module not found!"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV
          echo "Project found: $PROJECT_DIR"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug --no-daemon

      - name: Prepare APK
        run: |
          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not generated!"
            exit 1
          fi

          cp "$APK" "$GITHUB_WORKSPACE/Joguinho.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Joguinho-APK
          path: Joguinho.apk
          if-no-files-found: error
          retention-days: 30
