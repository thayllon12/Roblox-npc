
name: Build DEV AI ASSISTANT APK

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dev-ai-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:

      # 1. BAIXAR REPOSITÓRIO
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # 2. LOCALIZAR DEV.ZIP
      - name: Locate Dev.zip
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE=$(find "$GITHUB_WORKSPACE" \
            -maxdepth 4 \
            -type f \
            -iname "Dev.zip" \
            -not -path "*/.git/*" \
            -print -quit)

          if [ -z "$ZIP_FILE" ]; then
            echo "::error::Dev.zip não encontrado."
            find "$GITHUB_WORKSPACE" -maxdepth 4 -type f
            exit 1
          fi

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

          echo "=== ZIP ENCONTRADO ==="
          ls -lh "$ZIP_FILE"
          file "$ZIP_FILE"

      # 3. VALIDAR E EXTRAIR ZIP
      - name: Extract Android project
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -s "$ZIP_FILE" ]; then
            echo "::error::Dev.zip está vazio."
            exit 1
          fi

          echo "=== VALIDANDO ZIP ==="

          unzip -tq "$ZIP_FILE"

          EXTRACT_DIR="$RUNNER_TEMP/dev-project"

          mkdir -p "$EXTRACT_DIR"

          echo "=== EXTRAINDO PROJETO ==="

          unzip -q "$ZIP_FILE" -d "$EXTRACT_DIR"

          echo "EXTRACT_DIR=$EXTRACT_DIR" >> "$GITHUB_ENV"

          find "$EXTRACT_DIR" -maxdepth 5 -type f | head -200

      # 4. DETECTAR RAIZ ANDROID
      - name: Detect Android project
        shell: bash
        run: |
          set -euo pipefail

          SETTINGS=$(find "$EXTRACT_DIR" \
            -type f \
            \( -name "settings.gradle.kts" \
            -o -name "settings.gradle" \) \
            -print -quit)

          if [ -z "$SETTINGS" ]; then
            echo "::error::settings.gradle não encontrado."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          if [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ] && \
             [ ! -f "$PROJECT_DIR/app/build.gradle" ]; then
            echo "::error::Módulo Android app não encontrado."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "=== PROJETO DETECTADO ==="
          echo "$PROJECT_DIR"

          echo "=== ESTRUTURA ==="
          ls -la "$PROJECT_DIR"

      # 5. INSTALAR JAVA 17
      # IMPORTANTE: sem cache automático nesta etapa,
      # pois o projeto está dentro de Dev.zip.
      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # 6. INSTALAR ANDROID SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      # 7. ACEITAR LICENÇAS
      - name: Accept Android licenses
        shell: bash
        run: |
          set -euo pipefail

          set +o pipefail
          yes | sdkmanager --licenses
          set -o pipefail

      # 8. INSTALAR SDK, NDK E CMAKE
      - name: Install Android packages
        shell: bash
        run: |
          set -euo pipefail

          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;26.1.10909125" \
            "cmake;3.22.1"

      # 9. CONFIGURAR AMBIENTE ANDROID
      - name: Configure Android environment
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$PROJECT_DIR"

          printf 'sdk.dir=%s\n' "$ANDROID_SDK_ROOT" \
            > "$PROJECT_DIR/local.properties"

          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" \
            >> "$GITHUB_ENV"

          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/26.1.10909125" \
            >> "$GITHUB_ENV"

          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/26.1.10909125" \
            >> "$GITHUB_ENV"

          echo "=== ANDROID SDK ==="
          sdkmanager --list_installed

          echo "=== NDK ==="
          ls "$ANDROID_SDK_ROOT/ndk"

      # 10. CONFIGURAR GRADLE
      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # 11. VERIFICAR FERRAMENTAS
      - name: Verify build environment
        shell: bash
        run: |
          set -euo pipefail

          echo "=== JAVA ==="
          java -version

          echo "=== GRADLE ==="
          gradle --version

          echo "=== CMAKE ==="
          "$ANDROID_SDK_ROOT/cmake/3.22.1/bin/cmake" --version

          echo "=== NDK ==="
          test -d "$ANDROID_NDK_ROOT"

          echo "=== PROJETO ==="
          test -f "$PROJECT_DIR/settings.gradle" || \
          test -f "$PROJECT_DIR/settings.gradle.kts"

          test -f "$PROJECT_DIR/app/build.gradle" || \
          test -f "$PROJECT_DIR/app/build.gradle.kts"

          echo "=== CMAKE DO APLICATIVO ==="

          if [ -f "$PROJECT_DIR/app/src/main/cpp/CMakeLists.txt" ]; then
            echo "CMakeLists.txt encontrado."
          else
            echo "::warning::CMakeLists.txt não encontrado."
          fi

          if [ -f "$PROJECT_DIR/app/src/main/cpp/llama.cpp/CMakeLists.txt" ]; then
            echo "llama.cpp encontrado."
          else
            echo "::warning::llama.cpp não encontrado no caminho esperado."
          fi

      # 12. BAIXAR DEPENDÊNCIAS E COMPILAR
      - name: Build Android APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          echo "=== PREPARANDO DEPENDÊNCIAS ==="

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            GRADLE_CMD="./gradlew"
          else
            GRADLE_CMD="gradle"
          fi

          echo "=== VERSÃO DO GRADLE ==="
          $GRADLE_CMD --version

          echo "=== RESOLVENDO DEPENDÊNCIAS ==="

          $GRADLE_CMD \
            --no-daemon \
            --stacktrace \
            --console=plain \
            dependencies \
            --configuration debugRuntimeClasspath \
            2>&1 | tee "$RUNNER_TEMP/dependencies.log"

          echo "=== COMPILANDO APK DEBUG ==="

          $GRADLE_CMD \
            --no-daemon \
            --stacktrace \
            --info \
            --console=plain \
            assembleDebug \
            2>&1 | tee "$RUNNER_TEMP/build.log"

          echo "=== BUILD FINALIZADO ==="

      # 13. VERIFICAR APK
      - name: Verify APK
        if: success()
        shell: bash
        run: |
          set -euo pipefail

          APK_DIR="$PROJECT_DIR/app/build/outputs/apk/debug"

          if [ ! -d "$APK_DIR" ]; then
            echo "::error::Diretório APK não encontrado."
            exit 1
          fi

          APK=$(find "$APK_DIR" \
            -maxdepth 1 \
            -type f \
            -name "*.apk" \
            -print -quit)

          if [ -z "$APK" ]; then
            echo "::error::Nenhum APK foi gerado."
            exit 1
          fi

          echo "=== APK GERADO ==="
          ls -lh "$APK"

          echo "=== SHA256 ==="
          sha256sum "$APK"

          echo "APK_PATH=$APK" >> "$GITHUB_ENV"

      # 14. SALVAR LOGS
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DEV-AI-ASSISTANT-BUILD-LOG
          path: |
            ${{ runner.temp }}/build.log
            ${{ runner.temp }}/dependencies.log
          if-no-files-found: ignore
          retention-days: 14

      # 15. PUBLICAR APK
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: DEV-AI-ASSISTANT-APK
          path: |
            ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      # 16. RESUMO DA COMPILAÇÃO
      - name: Build summary
        if: always()
        shell: bash
        run: |
          echo "## DEV AI ASSISTANT" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          if [ "${{ job.status }}" = "success" ]; then
            echo "APK Debug compilado com sucesso." \
              >> "$GITHUB_STEP_SUMMARY"
          else
            echo "A compilação falhou. Consulte os logs." \
              >> "$GITHUB_STEP_SUMMARY"
          fi
