
name: Build DEV AI ASSISTANT APK

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dev-ai-assistant-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:

      # 1. BAIXAR REPOSITÓRIO
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # 2. LOCALIZAR DEV.ZIP
      - name: Locate Dev.zip
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE=$(find "$GITHUB_WORKSPACE" \
            -maxdepth 5 \
            -type f \
            -iname "Dev.zip" \
            -not -path "*/.git/*" \
            -print -quit)

          if [ -z "$ZIP_FILE" ]; then
            echo "::error::Dev.zip não encontrado."
            find "$GITHUB_WORKSPACE" -maxdepth 5 -type f
            exit 1
          fi

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

          echo "=== ARQUIVO ENCONTRADO ==="
          ls -lh "$ZIP_FILE"
          file "$ZIP_FILE"

      # 3. VALIDAR E EXTRAIR PROJETO
      - name: Extract Dev.zip
        shell: bash
        run: |
          set -euo pipefail

          if ! unzip -tq "$ZIP_FILE"; then
            echo "::error::Dev.zip não é um arquivo ZIP válido."
            exit 1
          fi

          EXTRACT_DIR="$RUNNER_TEMP/dev-project"

          mkdir -p "$EXTRACT_DIR"

          unzip -q "$ZIP_FILE" -d "$EXTRACT_DIR"

          echo "EXTRACT_DIR=$EXTRACT_DIR" >> "$GITHUB_ENV"

          echo "=== ARQUIVOS EXTRAÍDOS ==="
          find "$EXTRACT_DIR" -maxdepth 5 -type f | head -200

      # 4. DETECTAR PROJETO ANDROID
      - name: Detect Android project
        shell: bash
        run: |
          set -euo pipefail

          SETTINGS=$(find "$EXTRACT_DIR" \
            -type f \
            \( -name "settings.gradle.kts" \
            -o -name "settings.gradle" \) \
            -print -quit)

          if [ -z "$SETTINGS" ]; then
            echo "::error::Nenhum settings.gradle encontrado."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          if [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ] && \
             [ ! -f "$PROJECT_DIR/app/build.gradle" ]; then
            echo "::error::Módulo app não encontrado."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "=== RAIZ ANDROID ==="
          echo "$PROJECT_DIR"

          echo "=== SETTINGS ==="
          cat "$SETTINGS"

      # 5. INSTALAR JAVA 17
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 6. CONFIGURAR ANDROID SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      # 7. ACEITAR LICENÇAS
      - name: Accept Android licenses
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses || true

      # 8. INSTALAR PACOTES ANDROID
      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;26.1.10909125" \
            "cmake;3.22.1"

      # 9. CONFIGURAR AMBIENTE
      - name: Configure Android environment
        shell: bash
        run: |
          set -euo pipefail

          printf 'sdk.dir=%s\n' "$ANDROID_SDK_ROOT" \
            > "$PROJECT_DIR/local.properties"

          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" \
            >> "$GITHUB_ENV"

          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/26.1.10909125" \
            >> "$GITHUB_ENV"

          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/26.1.10909125" \
            >> "$GITHUB_ENV"

          echo "=== SDK INSTALADO ==="
          sdkmanager --list_installed

      # 10. CONFIGURAR GRADLE
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # 11. VERIFICAR FERRAMENTAS
      - name: Verify build environment
        shell: bash
        run: |
          set -euo pipefail

          echo "=== JAVA ==="
          java -version

          echo "=== GRADLE ==="
          gradle --version

          echo "=== ANDROID SDK ==="
          test -d "$ANDROID_SDK_ROOT/platforms/android-35"

          echo "=== NDK ==="
          test -d "$ANDROID_NDK_ROOT"

          echo "=== CMAKE ==="
          "$ANDROID_SDK_ROOT/cmake/3.22.1/bin/cmake" --version

          echo "=== CONFIGURAÇÃO NATIVA ==="

          if [ -f "$PROJECT_DIR/app/src/main/cpp/CMakeLists.txt" ]; then
            echo "CMakeLists.txt encontrado."

          else
            echo "::warning::CMakeLists.txt não encontrado."
          fi

          if [ -f "$PROJECT_DIR/app/src/main/cpp/llama.cpp/CMakeLists.txt" ]; then
            echo "llama.cpp encontrado."

          else
            echo "::warning::llama.cpp não encontrado."
          fi

      # 12. COMPILAR APK E IDENTIFICAR ERROS
      - name: Build Android APK
        shell: bash
        run: |
          set -uo pipefail

          cd "$PROJECT_DIR"

          echo "=== SELECIONANDO GRADLE ==="

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            GRADLE="./gradlew"
            echo "Usando Gradle Wrapper."

          else
            GRADLE="gradle"
            echo "Usando Gradle instalado."
          fi

          echo "=== COMPILANDO ==="

          set +e

          $GRADLE \
            --no-daemon \
            --stacktrace \
            --info \
            --console=plain \
            --warning-mode all \
            assembleDebug \
            2>&1 | tee "$RUNNER_TEMP/build.log"

          BUILD_STATUS=${PIPESTATUS[0]}

          set -e

          if [ "$BUILD_STATUS" -ne 0 ]; then

            echo ""
            echo "================================"
            echo "       BUILD FALHOU"
            echo "================================"

            echo "=== CAUSA PROVÁVEL ==="

            grep -n -i -A 10 -B 5 \
              -E "What went wrong|Caused by:|Could not resolve|Could not find|Compilation error|Execution failed|error:" \
              "$RUNNER_TEMP/build.log" || true

            exit "$BUILD_STATUS"
          fi

          echo "=== BUILD CONCLUÍDO ==="

      # 13. VERIFICAR APK
      - name: Verify APK
        if: success()
        shell: bash
        run: |
          set -euo pipefail

          APK_DIR="$PROJECT_DIR/app/build/outputs/apk/debug"

          if [ ! -d "$APK_DIR" ]; then
            echo "::error::Pasta de APK não encontrada."
            exit 1
          fi

          APK=$(find "$APK_DIR" \
            -maxdepth 1 \
            -type f \
            -name "*.apk" \
            -print -quit)

          if [ -z "$APK" ]; then
            echo "::error::Nenhum APK gerado."
            exit 1
          fi

          echo "=== APK GERADO ==="
          ls -lh "$APK"

          echo "=== SHA256 ==="
          sha256sum "$APK"

      # 14. PUBLICAR LOGS
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DEV-AI-ASSISTANT-BUILD-LOG
          path: |
            ${{ runner.temp }}/build.log
          if-no-files-found: ignore
          retention-days: 14

      # 15. PUBLICAR APK
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: DEV-AI-ASSISTANT-APK
          path: |
            ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      # 16. RESUMO FINAL
      - name: Build summary
        if: always()
        shell: bash
        run: |
          echo "# DEV AI ASSISTANT" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          if [ "${{ job.status }}" = "success" ]; then
            echo "APK compilado com sucesso!" \
              >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Falha na compilação. Consulte os logs." \
              >> "$GITHUB_STEP_SUMMARY"
          fi
