
name: Build APK Android

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build DEV AI ASSISTANT
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate Dev.zip
        run: |
          set -e

          ZIP_FILE=$(find . -type f -iname "Dev.zip" -print -quit)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERRO: Dev.zip não encontrado no repositório."
            exit 1
          fi

          echo "ZIP encontrado: $ZIP_FILE"
          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      - name: Extract project ZIP
        run: |
          set -e

          mkdir -p "$RUNNER_TEMP/dev-extracted"

          unzip -q "$ZIP_FILE" -d "$RUNNER_TEMP/dev-extracted"

          echo "=== Conteúdo extraído ==="
          find "$RUNNER_TEMP/dev-extracted" -maxdepth 3 -type f | head -100

      - name: Locate Android Gradle project
        run: |
          set -e

          SETTINGS=$(find "$RUNNER_TEMP/dev-extracted" \
            -type f -name "settings.gradle.kts" -print -quit)

          if [ -z "$SETTINGS" ]; then
            SETTINGS=$(find "$RUNNER_TEMP/dev-extracted" \
              -type f -name "settings.gradle" -print -quit)
          fi

          if [ -z "$SETTINGS" ]; then
            echo "ERRO: settings.gradle não encontrado."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          if [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            echo "ERRO: app/build.gradle.kts não encontrado."
            exit 1
          fi

          echo "Projeto encontrado em: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Accept Android licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Install Android SDK packages
        run: |
          sdkmanager --install \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;26.1.10909125" \
            "cmake;3.22.1" \
            "platform-tools"

      - name: Configure Android
        run: |
          set -e

          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$PROJECT_DIR/local.properties"

          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/26.1.10909125" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/26.1.10909125" >> "$GITHUB_ENV"

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Android APK
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "=== Projeto ==="
          pwd

          echo "=== Gradle ==="
          gradle --version

          echo "=== Compilando APK ==="
          gradle --no-daemon assembleDebug --stacktrace

          echo "=== Build concluído ==="

      - name: Verify APK
        if: always()
        run: |
          echo "=== APKs gerados ==="

          find "$PROJECT_DIR" \
            -type f -name "*.apk" -print || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: DEV-AI-ASSISTANT-APK
          path: |
            ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
