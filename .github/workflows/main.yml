
name: Build DEV AI ASSISTANT APK

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dev-ai-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      # 1. Checkout
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # 2. Localizar Dev.zip
      - name: Locate Dev.zip
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE=$(find "$GITHUB_WORKSPACE" \
            -type f \
            -iname "Dev.zip" \
            -not -path "*/.git/*" \
            -print -quit)

          if [ -z "$ZIP_FILE" ]; then
            echo "::error::Dev.zip não encontrado."
            exit 1
          fi

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"
          echo "Encontrado: $ZIP_FILE"

      # 3. Validar e extrair
      - name: Extract Android project
        shell: bash
        run: |
          set -euo pipefail

          unzip -tq "$ZIP_FILE"

          EXTRACT_DIR="$RUNNER_TEMP/dev-project"

          mkdir -p "$EXTRACT_DIR"

          unzip -q "$ZIP_FILE" -d "$EXTRACT_DIR"

          echo "EXTRACT_DIR=$EXTRACT_DIR" >> "$GITHUB_ENV"

          echo "=== ARQUIVOS EXTRAÍDOS ==="
          find "$EXTRACT_DIR" -maxdepth 4 -type f | head -150

      # 4. Encontrar projeto Android
      - name: Detect Android project
        shell: bash
        run: |
          set -euo pipefail

          SETTINGS=$(find "$EXTRACT_DIR" \
            -type f \
            \( -name "settings.gradle.kts" \
            -o -name "settings.gradle" \) \
            -print -quit)

          if [ -z "$SETTINGS" ]; then
            echo "::error::settings.gradle não encontrado."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          if [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ] && \
             [ ! -f "$PROJECT_DIR/app/build.gradle" ]; then
            echo "::error::Módulo app não encontrado."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "=== PROJETO ==="
          echo "$PROJECT_DIR"

      # 5. Instalar Java 17
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # 6. Instalar Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      # 7. Aceitar licenças Android
      - name: Accept Android licenses
        shell: bash
        run: |
          set -e

          yes | sdkmanager --licenses

      # 8. Instalar pacotes Android
      - name: Install Android SDK NDK CMake
        shell: bash
        run: |
          set -euo pipefail

          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;26.1.10909125" \
            "cmake;3.22.1"

      # 9. Configurar ambiente
      - name: Configure Android environment
        shell: bash
        run: |
          set -euo pipefail

          printf 'sdk.dir=%s\n' "$ANDROID_SDK_ROOT" \
            > "$PROJECT_DIR/local.properties"

          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/26.1.10909125" \
            >> "$GITHUB_ENV"

          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/26.1.10909125" \
            >> "$GITHUB_ENV"

          echo "=== SDK INSTALADO ==="
          sdkmanager --list_installed

      # 10. Configurar Gradle
      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # 11. Verificar ferramentas
      - name: Verify build environment
        shell: bash
        run: |
          set -euo pipefail

          java -version
          gradle --version
          cmake --version
          git --version

          echo "=== NDK ==="
          test -d "$ANDROID_NDK_ROOT"

          echo "=== CMAKE ==="
          CMAKE_FILE="$PROJECT_DIR/app/src/main/cpp/CMakeLists.txt"

          if [ ! -f "$CMAKE_FILE" ]; then
            echo "::error::CMakeLists.txt não encontrado."
            exit 1
          fi

          echo "CMakeLists.txt encontrado."

          if [ -f "$PROJECT_DIR/app/src/main/cpp/llama.cpp/CMakeLists.txt" ]; then
            echo "llama.cpp encontrado."
          else
            echo "::warning::llama.cpp não está presente no diretório esperado."
            echo "Verifique a configuração do backend nativo."
          fi

      # 12. Compilar
      - name: Build Android APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          echo "=== INICIANDO COMPILAÇÃO ==="

          gradle \
            --no-daemon \
            --stacktrace \
            --info \
            --console=plain \
            assembleDebug \
            2>&1 | tee "$RUNNER_TEMP/build.log"

          echo "=== COMPILAÇÃO CONCLUÍDA ==="

      # 13. Verificar APK
      - name: Verify APK
        if: success()
        shell: bash
        run: |
          set -euo pipefail

          APK_DIR="$PROJECT_DIR/app/build/outputs/apk/debug"

          if [ ! -d "$APK_DIR" ]; then
            echo "::error::Diretório APK não encontrado."
            exit 1
          fi

          APK=$(find "$APK_DIR" -maxdepth 1 \
            -type f -name "*.apk" -print -quit)

          if [ -z "$APK" ]; then
            echo "::error::Nenhum APK foi gerado."
            exit 1
          fi

          echo "APK GERADO:"
          ls -lh "$APK"

          sha256sum "$APK"

      # 14. Logs
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DEV-AI-ASSISTANT-BUILD-LOG
          path: |
            ${{ runner.temp }}/build.log
          if-no-files-found: ignore
          retention-days: 14

      # 15. Publicar APK
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: DEV-AI-ASSISTANT-APK
          path: |
            ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
