name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: ${{ github.workspace }}/android-sdk
      ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK (manual)
        run: |
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl -fsSL -o /tmp/cmdtools.zip \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/cmdtools.zip -d "$ANDROID_HOME/cmdline-tools"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"

          mkdir -p "$ANDROID_HOME/licenses"
          printf '%s\n' "24333f8a63b6825ea9c5514fde33152b18a0b7ea" > "$ANDROID_HOME/licenses/android-sdk-license"
          printf '%s\n' "84831b9409646a918e30573bab4c9c91346d8abd" > "$ANDROID_HOME/licenses/android-sdk-preview-license"
          printf '%s\n' "d56f5187479451eabf01fb78af6dfcb131a6481e" >> "$ANDROID_HOME/licenses/android-sdk-license"

          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes 2>/dev/null | sdkmanager --sdk_root="$ANDROID_HOME" --licenses >/dev/null || true
          sdkmanager --sdk_root="$ANDROID_HOME" \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV

      - name: Unzip project
        run: |
          if [ -f "LEON-RUSH.zip" ]; then
            echo "Extracting LEON-RUSH.zip..."
            unzip -o LEON-RUSH.zip -d .
          elif [ -f "leon-rush.zip" ]; then
            unzip -o leon-rush.zip -d .
          fi
          echo "Files after unzip:"
          find . -name "project.godot" | head -20
          ls -la

      - name: Find project root
        id: project
        run: |
          FOUND=$(find . -name "project.godot" | head -n 1)
          if [ -z "$FOUND" ]; then
            echo "project.godot not found after unzip"
            find . -maxdepth 3 -type d
            ls -la
            exit 1
          fi
          DIR=$(dirname "$FOUND")
          echo "Found project at: $DIR"
          echo "dir=$DIR" >> $GITHUB_OUTPUT

      - name: Download Godot 4.3
        run: |
          mkdir -p "$HOME/godot"
          curl -fsSL -o /tmp/godot.zip \
            "https://github.com/godotengine/godot-builds/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip"
          unzip -o /tmp/godot.zip -d "$HOME/godot"
          GODOT_BIN=$(find "$HOME/godot" -type f -name "Godot*" | head -n 1)
          chmod +x "$GODOT_BIN"
          echo "GODOT_BIN=$GODOT_BIN" >> $GITHUB_ENV

          curl -fsSL -o /tmp/templates.tpz \
            "https://github.com/godotengine/godot-builds/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz"
          mkdir -p "$HOME/.local/share/godot/export_templates/4.3.stable"
          unzip -o /tmp/templates.tpz -d /tmp/godot_templates
          cp -r /tmp/godot_templates/templates/* "$HOME/.local/share/godot/export_templates/4.3.stable/"

      - name: Create debug keystore
        run: |
          keytool -genkeypair -v \
            -keystore "$HOME/debug.keystore" \
            -storepass android \
            -keypass android \
            -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=LeonRush,O=LeonRush,C=BR"

      - name: Write export_presets.cfg
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          cat > export_presets.cfg << EOF
          [preset.0]
          name="Android"
          platform="Android"
          runnable=true
          dedicated_server=false
          custom_features=""
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          export_path="build/LeonRush.apk"
          encryption_include_filters=""
          encryption_exclude_filters=""
          encrypt_pck=false
          encrypt_directory=false
          script_export_mode=2

          [preset.0.options]
          custom_template/debug=""
          custom_template/release=""
          gradle_build/use_gradle_build=false
          gradle_build/export_format=0
          architectures/armeabi-v7a=false
          architectures/arm64-v8a=true
          architectures/x86=false
          architectures/x86_64=false
          version/code=1
          version/name="1.0.0"
          package/unique_name="com.leonrush.game"
          package/name="Leon Rush"
          package/signed=true
          package/app_category=2
          package/retain_data_on_uninstall=false
          package/exclude_from_recents=false
          launcher_icons/main_192x192=""
          graphics/opengl_debug=false
          xr_features/xr_mode=0
          screen/immersive_mode=true
          screen/support_small=true
          screen/support_normal=true
          screen/support_large=true
          screen/support_xlarge=true
          user_data_backup/allow=false
          command_line/extra_args=""
          apk_expansion/enable=false
          permissions/custom_permissions=false
          permissions/internet=false
          permissions/vibrate=true
          keystore/debug=$HOME/debug.keystore
          keystore/debug_user=androiddebugkey
          keystore/debug_password=android
          EOF

      - name: Export APK
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          mkdir -p build
          "$GODOT_BIN" --headless --path . --export-debug "Android" build/LeonRush.apk
          ls -lh build/ || true
          test -f build/LeonRush.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: leon-rush-apk
          path: ${{ steps.project.outputs.dir }}/build/LeonRush.apk
          retention-days: 14
