
name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Validate and export Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GODOT_VERSION: 4.3

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            'platform-tools' \
            'platforms;android-34' \
            'build-tools;34.0.0'

      - name: Locate and extract project archive
        id: project
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f LEON-RUSH.zip ]]; then
            unzip -oq LEON-RUSH.zip -d extracted
          elif [[ -f leon-rush.zip ]]; then
            unzip -oq leon-rush.zip -d extracted
          fi

          PROJECT_FILE="$(find . -type f -name project.godot -not -path './.git/*' -print -quit)"
          if [[ -z "$PROJECT_FILE" ]]; then
            echo 'ERROR: project.godot was not found.'
            find . -maxdepth 4 -type f | sort | head -200
            exit 1
          fi

          PROJECT_DIR="$(dirname "$PROJECT_FILE")"
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Godot project: $PROJECT_DIR"

      - name: Download Godot 4.3 and Android export templates
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/godot" "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"

          curl -fL --retry 3 \
            "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" \
            -o /tmp/godot.zip

          unzip -oq /tmp/godot.zip -d "$HOME/godot"
          GODOT_BIN="$(find "$HOME/godot" -maxdepth 2 -type f -name 'Godot*' -print -quit)"

          if [[ -z "$GODOT_BIN" ]]; then
            echo 'Godot executable not found'
            exit 1
          fi

          chmod +x "$GODOT_BIN"
          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"

          curl -fL --retry 3 \
            "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz" \
            -o /tmp/templates.tpz

          mkdir -p /tmp/godot-templates
          unzip -oq /tmp/templates.tpz -d /tmp/godot-templates

          cp -a /tmp/godot-templates/templates/. "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"

      - name: Create Android debug keystore
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"

          keytool -genkeypair -v \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -keypass android \
            -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname 'CN=LeonRush,O=LeonRush,C=BR'

      - name: Create Android export preset
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          cat > export_presets.cfg <<'EOF'
          [preset.0]
          name="Android"
          platform="Android"
          runnable=true
          dedicated_server=false
          custom_features=""
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          export_path="build/LeonRush.apk"
          encryption_include_filters=""
          encryption_exclude_filters=""
          encrypt_pck=false
          encrypt_directory=false
          script_export_mode=2

          [preset.0.options]
          custom_template/debug=""
          custom_template/release=""
          gradle_build/use_gradle_build=false
          gradle_build/export_format=0
          architectures/armeabi-v7a=false
          architectures/arm64-v8a=true
          architectures/x86=false
          architectures/x86_64=false
          version/code=1
          version/name="1.0.0"
          package/unique_name="com.leonrush.game"
          package/name="Leon Rush"
          package/signed=true
          package/app_category=2
          package/retain_data_on_uninstall=false
          package/exclude_from_recents=false
          launcher_icons/main_192x192=""
          graphics/opengl_debug=false
          xr_features/xr_mode=0
          screen/immersive_mode=true
          screen/support_small=true
          screen/support_normal=true
          screen/support_large=true
          screen/support_xlarge=true
          user_data_backup/allow=false
          command_line/extra_args=""
          apk_expansion/enable=false
          permissions/custom_permissions=false
          permissions/internet=false
          permissions/vibrate=true
          keystore/debug="$HOME/.android/debug.keystore"
          keystore/debug_user="androiddebugkey"
          keystore/debug_password="android"
          EOF

      - name: Import project and validate scripts
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          set -euo pipefail
          "$GODOT_BIN" --headless --editor --path . --import
          "$GODOT_BIN" --headless --editor --path . --quit

      - name: Export Android APK
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build

          "$GODOT_BIN" --headless --path . --export-debug 'Android' build/LeonRush.apk

          test -s build/LeonRush.apk
          file build/LeonRush.apk
          ls -lh build/LeonRush.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: leon-rush-android-apk
          path: ${{ steps.project.outputs.dir }}/build/LeonRush.apk
          if-no-files-found: error
          retention-days: 14
