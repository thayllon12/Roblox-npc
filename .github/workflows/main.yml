
name: Build DEV AI ASSISTANT APK

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dev-ai-assistant-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:

      # 1. BAIXAR REPOSITÓRIO
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # 2. LOCALIZAR DEV.ZIP
      - name: Locate Dev.zip
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE=$(find "$GITHUB_WORKSPACE" \
            -maxdepth 5 \
            -type f \
            -iname "Dev.zip" \
            -not -path "*/.git/*" \
            -print -quit)

          if [ -z "$ZIP_FILE" ]; then
            echo "::error::Dev.zip não encontrado."
            exit 1
          fi

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

          echo "=== ZIP ENCONTRADO ==="
          ls -lh "$ZIP_FILE"
          file "$ZIP_FILE"

      # 3. VALIDAR E EXTRAIR ZIP
      - name: Extract Dev.zip
        shell: bash
        run: |
          set -euo pipefail

          if ! unzip -tq "$ZIP_FILE"; then
            echo "::error::Dev.zip inválido ou corrompido."
            exit 1
          fi

          EXTRACT_DIR="$RUNNER_TEMP/dev-project"

          mkdir -p "$EXTRACT_DIR"

          unzip -q "$ZIP_FILE" -d "$EXTRACT_DIR"

          echo "EXTRACT_DIR=$EXTRACT_DIR" >> "$GITHUB_ENV"

          echo "=== ARQUIVOS EXTRAÍDOS ==="
          find "$EXTRACT_DIR" -maxdepth 5 -type f | head -200

      # 4. DETECTAR PROJETO ANDROID
      - name: Detect Android project
        shell: bash
        run: |
          set -euo pipefail

          SETTINGS=$(find "$EXTRACT_DIR" \
            -type f \
            \( -name "settings.gradle.kts" \
            -o -name "settings.gradle" \) \
            -print -quit)

          if [ -z "$SETTINGS" ]; then
            echo "::error::settings.gradle não encontrado."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          if [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ] && \
             [ ! -f "$PROJECT_DIR/app/build.gradle" ]; then
            echo "::error::Módulo app não encontrado."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "=== PROJETO ANDROID ==="
          echo "$PROJECT_DIR"

      # 5. INSTALAR JAVA 17
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 6. INSTALAR ANDROID SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      # 7. ACEITAR LICENÇAS
      - name: Accept Android licenses
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses || true

      # 8. INSTALAR SDK, NDK E CMAKE
      - name: Install Android packages
        shell: bash
        run: |
          set -euo pipefail

          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;26.1.10909125" \
            "cmake;3.22.1"

      # 9. CONFIGURAR ANDROID
      - name: Configure Android environment
        shell: bash
        run: |
          set -euo pipefail

          printf 'sdk.dir=%s\n' "$ANDROID_SDK_ROOT" \
            > "$PROJECT_DIR/local.properties"

          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" \
            >> "$GITHUB_ENV"

          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/26.1.10909125" \
            >> "$GITHUB_ENV"

          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/26.1.10909125" \
            >> "$GITHUB_ENV"

      # 10. CONFIGURAR GRADLE
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # 11. PREPARAR LLAMA.CPP
      - name: Prepare llama.cpp
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          LLAMA_DIR="$PROJECT_DIR/app/src/main/cpp/llama.cpp"
          PREPARE_SCRIPT="$PROJECT_DIR/scripts/prepare-llama.sh"

          echo "=== PREPARANDO LLAMA.CPP ==="

          # Preferir o script do próprio projeto.
          if [ -f "$PREPARE_SCRIPT" ]; then

            echo "Executando scripts/prepare-llama.sh"

            bash "$PREPARE_SCRIPT"

          fi

          # Verificar se o script preparou a biblioteca.
          if [ ! -f "$LLAMA_DIR/CMakeLists.txt" ]; then

            echo "Biblioteca não encontrada."
            echo "Baixando llama.cpp oficial..."

            mkdir -p "$(dirname "$LLAMA_DIR")"

            rm -rf "$LLAMA_DIR"

            git clone \
              --depth 1 \
              --recurse-submodules \
              https://github.com/ggml-org/llama.cpp.git \
              "$LLAMA_DIR"

          fi

          # Validar biblioteca.
          if [ ! -f "$LLAMA_DIR/CMakeLists.txt" ]; then
            echo "::error::llama.cpp não foi instalado corretamente."
            exit 1
          fi

          echo "=== LLAMA.CPP PRONTO ==="
          ls -la "$LLAMA_DIR"

      # 12. VERIFICAR AMBIENTE NATIVO
      - name: Verify native environment
        shell: bash
        run: |
          set -euo pipefail

          echo "=== JAVA ==="
          java -version

          echo "=== GRADLE ==="
          gradle --version

          echo "=== NDK ==="
          test -d "$ANDROID_NDK_ROOT"

          echo "=== CMAKE ==="
          "$ANDROID_SDK_ROOT/cmake/3.22.1/bin/cmake" --version

          echo "=== LLAMA.CPP ==="
          test -f "$PROJECT_DIR/app/src/main/cpp/llama.cpp/CMakeLists.txt"

          echo "=== CMAKE DO APLICATIVO ==="

          if [ -f "$PROJECT_DIR/app/src/main/cpp/CMakeLists.txt" ]; then
            echo "CMakeLists.txt encontrado."
          else
            echo "::error::CMakeLists.txt principal ausente."
            exit 1
          fi

      # 13. COMPILAR APK
      - name: Build Android APK
        shell: bash
        run: |
          set -uo pipefail

          cd "$PROJECT_DIR"

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            GRADLE="./gradlew"
          else
            GRADLE="gradle"
          fi

          echo "=== COMPILANDO DEV AI ASSISTANT ==="

          set +e

          $GRADLE \
            --no-daemon \
            --stacktrace \
            --info \
            --console=plain \
            --warning-mode all \
            assembleDebug \
            2>&1 | tee "$RUNNER_TEMP/build.log"

          BUILD_STATUS=${PIPESTATUS[0]}

          set -e

          if [ "$BUILD_STATUS" -ne 0 ]; then

            echo "================================"
            echo "       BUILD FALHOU"
            echo "================================"

            grep -n -i -A 10 -B 5 \
              -E "What went wrong|Caused by:|CMake Error|Could not resolve|Could not find|Compilation error|Execution failed|error:" \
              "$RUNNER_TEMP/build.log" || true

            exit "$BUILD_STATUS"
          fi

          echo "BUILD CONCLUÍDO!"

      # 14. LOCALIZAR E VALIDAR APK
      - name: Verify APK
        if: success()
        shell: bash
        run: |
          set -euo pipefail

          APK=$(find "$PROJECT_DIR/app/build/outputs/apk" \
            -type f \
            -name "*.apk" \
            -print -quit)

          if [ -z "$APK" ]; then
            echo "::error::APK não foi gerado."
            exit 1
          fi

          echo "=== APK GERADO ==="
          ls -lh "$APK"

          sha256sum "$APK"

      # 15. ENVIAR LOGS
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DEV-AI-ASSISTANT-BUILD-LOG
          path: |
            ${{ runner.temp }}/build.log
          if-no-files-found: ignore
          retention-days: 14

      # 16. PUBLICAR APK
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: DEV-AI-ASSISTANT-APK
          path: |
            ${{ env.PROJECT_DIR }}/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14

      # 17. RESUMO
      - name: Build summary
        if: always()
        shell: bash
        run: |
          echo "# DEV AI ASSISTANT" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          if [ "${{ job.status }}" = "success" ]; then
            echo "APK compilado com sucesso!" \
              >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Falha na compilação." \
              >> "$GITHUB_STEP_SUMMARY"
          fi
