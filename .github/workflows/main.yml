name: DEV AI ASSISTANT - Build APK

on:
  push:
    branches: [main, master]
    paths:
      - '**/*.kt'
      - '**/*.java'
      - '**/*.cpp'
      - '**/*.h'
      - '**/*.xml'
      - '**/*.kts'
      - 'Dev.zip'
      - '.github/workflows/android-build.yml'

  pull_request:
    branches: [main, master]

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Locate and extract project
        id: project
        shell: bash
        run: |
          set -euo pipefail

          EXTRACT_DIR="$RUNNER_TEMP/dev-project"
          mkdir -p "$EXTRACT_DIR"

          if [[ -f "$GITHUB_WORKSPACE/Dev.zip" ]]; then
            echo "Dev.zip encontrado."
            unzip -q "$GITHUB_WORKSPACE/Dev.zip" -d "$EXTRACT_DIR"
            ROOT="$EXTRACT_DIR"
          else
            echo "Usando projeto versionado."
            ROOT="$GITHUB_WORKSPACE"
          fi

          SETTINGS="$(find "$ROOT" -type f \
            -name settings.gradle.kts \
            -not -path '*/.gradle/*' \
            -print -quit)"

          if [[ -z "$SETTINGS" ]]; then
            echo "::error::settings.gradle.kts não encontrado."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS")"

          if [[ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]] && \
             [[ ! -f "$PROJECT_DIR/app/build.gradle" ]]; then
            echo "::error::Módulo app não encontrado."
            exit 1
          fi

          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true

      - name: Install Android packages
        shell: bash
        run: |
          set -euo pipefail

          sdkmanager --install \
            'platform-tools' \
            'platforms;android-35' \
            'build-tools;35.0.0' \
            'ndk;26.1.10909125' \
            'cmake;3.22.1'

      - name: Configure Android SDK
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          set -euo pipefail

          printf 'sdk.dir=%s\n' "$ANDROID_SDK_ROOT" > local.properties

          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/26.1.10909125" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/26.1.10909125" >> "$GITHUB_ENV"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-disabled: false

      - name: Prepare llama.cpp
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -f scripts/prepare-llama.sh ]]; then
            chmod +x scripts/prepare-llama.sh
            scripts/prepare-llama.sh
          else
            echo "::error::scripts/prepare-llama.sh não encontrado."
            exit 1
          fi

          test -f app/src/main/cpp/llama.cpp/CMakeLists.txt
          test -f app/src/main/cpp/llama.cpp/ggml/CMakeLists.txt

      - name: Download Gradle dependencies
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          set -euo pipefail

          gradle \
            --no-daemon \
            --stacktrace \
            --refresh-dependencies \
            :app:dependencies

      - name: Build Debug APK
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          set -euo pipefail

          gradle \
            --no-daemon \
            --stacktrace \
            --warning-mode all \
            --console=plain \
            clean assembleDebug

      - name: Verify APK
        if: success()
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/debug/app-debug.apk"

          test -s "$APK"

          file "$APK"
          sha256sum "$APK"

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: DEV-AI-ASSISTANT-APK-${{ github.run_number }}
          path: ${{ steps.project.outputs.dir }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DEV-AI-ASSISTANT-BUILD-LOG-${{ github.run_number }}
          path: |
            ${{ steps.project.outputs.dir }}/app/build/reports/**
            ${{ runner.temp }}/dev-project/**/build/reports/**
          if-no-files-found: ignore
          retention-days: 14
