
name: Build Leon Rush Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Leon Rush
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      GODOT_VERSION: "4.3"

    steps:
      # 1. Checkout
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Java 17
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 3. Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"
          accept-android-sdk-licenses: "true"

      # 4. Install all Godot Android dependencies
      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          sdkmanager --sdk_root="$ANDROID_HOME" --install \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "cmdline-tools;latest" \
            "cmake;3.10.2.4988404" \
            "ndk;23.2.8568313"

          echo "ANDROID SDK:"
          echo "$ANDROID_HOME"

          echo "JAVA SDK:"
          echo "$JAVA_HOME"

      # 5. Locate and extract ZIP
      - name: Extract Leon Rush project
        id: project
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p extracted

          ARCHIVE=""

          for FILE in \
            "LEON-RUSH-FIXED.zip" \
            "LEON-RUSH.zip" \
            "leon-rush.zip"; do

            if [ -f "$FILE" ]; then
              ARCHIVE="$FILE"
              break
            fi
          done

          if [ -z "$ARCHIVE" ]; then
            echo "ERROR: Project ZIP not found."
            ls -lah
            exit 1
          fi

          echo "Extracting $ARCHIVE"

          unzip -oq "$ARCHIVE" -d extracted

          FOUND=$(find extracted \
            -type f \
            -name "project.godot" \
            -print -quit)

          if [ -z "$FOUND" ]; then
            echo "ERROR: project.godot not found."
            find extracted -maxdepth 5 -type f | head -200
            exit 1
          fi

          PROJECT_DIR="$(dirname "$FOUND")"

          echo "Project: $PROJECT_DIR"
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      # 6. Download Godot 4.3
      - name: Download Godot
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$HOME/godot"

          curl -fL --retry 3 \
            "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" \
            -o /tmp/godot.zip

          unzip -oq /tmp/godot.zip -d "$HOME/godot"

          GODOT_BIN=$(find "$HOME/godot" \
            -type f -name "Godot*" -print -quit)

          if [ -z "$GODOT_BIN" ]; then
            echo "Godot executable not found."
            exit 1
          fi

          chmod +x "$GODOT_BIN"

          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"

          "$GODOT_BIN" --version

      # 7. Install export templates
      - name: Download Android Export Templates
        shell: bash
        run: |
          set -euo pipefail

          curl -fL --retry 3 \
            "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz" \
            -o /tmp/templates.tpz

          mkdir -p /tmp/godot_templates

          unzip -oq /tmp/templates.tpz \
            -d /tmp/godot_templates

          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"

          mkdir -p "$TEMPLATE_DIR"

          cp -a /tmp/godot_templates/templates/. "$TEMPLATE_DIR/"

          echo "Export templates installed."

      # 8. Create debug keystore
      - name: Create Android Debug Keystore
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$HOME/.android"

          keytool -genkeypair -v \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -keypass android \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=LeonRush,O=LeonRush,C=BR"

          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$HOME/.android/debug.keystore" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android" >> "$GITHUB_ENV"

      # 9. Configure Godot editor Android settings
      - name: Configure Godot Android SDK paths
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$HOME/.config/godot"

          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$HOME/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF

          echo "Godot Android settings configured."

      # 10. Create export preset
      - name: Configure Android Export Preset
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          set -euo pipefail

          cat > export_presets.cfg <<'EOF'
          [preset.0]
          name="Android"
          platform="Android"
          runnable=true
          dedicated_server=false
          custom_features=""
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          export_path="build/LeonRush.apk"
          encryption_include_filters=""
          encryption_exclude_filters=""
          encrypt_pck=false
          encrypt_directory=false
          script_export_mode=2

          [preset.0.options]
          custom_template/debug=""
          custom_template/release=""
          gradle_build/use_gradle_build=false
          gradle_build/export_format=0
          architectures/armeabi-v7a=false
          architectures/arm64-v8a=true
          architectures/x86=false
          architectures/x86_64=false
          version/code=1
          version/name="1.0.0"
          package/unique_name="com.leonrush.game"
          package/name="Leon Rush"
          package/signed=true
          package/app_category=2
          package/retain_data_on_uninstall=false
          package/exclude_from_recents=false
          launcher_icons/main_192x192=""
          graphics/opengl_debug=false
          xr_features/xr_mode=0
          screen/immersive_mode=true
          screen/support_small=true
          screen/support_normal=true
          screen/support_large=true
          screen/support_xlarge=true
          user_data_backup/allow=false
          command_line/extra_args=""
          apk_expansion/enable=false
          permissions/custom_permissions=false
          permissions/internet=false
          permissions/vibrate=true
          keystore/debug=""
          keystore/debug_user=""
          keystore/debug_password=""
          EOF

          echo "Android preset created."

      # 11. Import project
      - name: Import Godot Project
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          set -euo pipefail

          "$GODOT_BIN" \
            --headless \
            --editor \
            --path . \
            --import

      # 12. Validate project
      - name: Validate Godot Project
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          set -euo pipefail

          "$GODOT_BIN" \
            --headless \
            --editor \
            --path . \
            --quit \
            --verbose

      # 13. Export APK
      - name: Export Android APK
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p build

          "$GODOT_BIN" \
            --headless \
            --path . \
            --export-debug \
            --verbose \
            "Android" \
            "build/LeonRush.apk" \
            2>&1 | tee /tmp/godot-export.log

          if [ ! -s build/LeonRush.apk ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "APK generated:"
          ls -lh build/LeonRush.apk

      # 14. Upload APK
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: leon-rush-android-apk
          path: ${{ steps.project.outputs.dir }}/build/LeonRush.apk
          if-no-files-found: error
          retention-days: 14

      # 15. Build summary
      - name: Build Summary
        if: success()
        shell: bash
        run: |
          echo "## LEON RUSH ANDROID" >> "$GITHUB_STEP_SUMMARY"
          echo "APK successfully exported." >> "$GITHUB_STEP_SUMMARY"
          echo "Artifact: leon-rush-android-apk" >> "$GITHUB_STEP_SUMMARY"
